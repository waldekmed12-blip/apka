name: Build and Upload

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Przykład dla Node.js (dostosuj do swojego języka/frameworka, np. Python, Java itp.)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # KLUCZOWA ZMIANA: upload-artifact w wersji v4
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: dist/  # Wskaż ścieżkę do wygenerowanych plików w swoim projekcie
