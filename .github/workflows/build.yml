name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Pobranie kodu z repozytorium
      uses: actions/checkout@v3

    - name: Ustawienie środowiska Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalacja zależności systemu
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev ncurses-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev

    - name: Instalacja Buildozera i Cythona
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36
        pip install git+https://github.5/kivy/buildozer.git@master

    - name: Budowanie pliku APK
      run: |
        buildozer -v android debug

    - name: Zapisanie pliku APK jako artefakt
      uses: actions/upload-artifact@v3
      with:
        name: polski-asystent-predkosci-apk
        path: bin/*.apk
